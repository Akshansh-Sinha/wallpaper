<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Calendar Wallpaper</title>

<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf"); font-weight: 300 700; }
  /* Tuned for CMF Phone 1: 1080x2400 (20:9) AMOLED, punch-hole top centre.
     Top ~22% left clear for the lock-screen clock, bottom clear for the dock. */
  :root {
    --paper: #F6E3BF;
    --paper-back: #E4C792;
    --cell: #F0D5A4;
    --cell-empty: #F3DEB6;
    --past-bg: #F2B8AC;
    --past-ink: #B3261E;
    --ring: #D9D2C4;
    --ring-shade: #9C9486;
    --hdr: #C0532A;      /* set per month by JS */
    --bg: #120A05;       /* set per month by JS */
    --glow: #FFB45A;     /* set per season by JS */
    --dim: 1;
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .2 0 0 0 0 .05 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --dim: .92; }
  }
  :root[data-theme="dark"] { --dim: .92; }
  :root[data-theme="light"] { --dim: 1; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    /* AMOLED: true black edges save battery and look deeper */
    background: radial-gradient(ellipse 120% 70% at 50% 55%, var(--bg) 0%, #000 85%);
    font-family: "Fredoka", "Baloo 2", system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- layered backdrop (depth of field) ---------- */
  .backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none; filter: brightness(var(--dim)); }
  .backdrop svg, .backdrop i { position: absolute; display: block; }
  .backdrop i {
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    mix-blend-mode: screen;
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- layout ---------- */
  .clock-zone { flex: 0 0 21vh; }   /* lock-screen clock sits here */
  .card {
    position: relative;
    width: min(86vw, 420px);
    transform: rotate(-1.2deg);
    filter: brightness(var(--dim)) drop-shadow(0 14px 22px rgba(0,0,0,.6));
  }
  /* a second sheet peeking out behind, like a real wall calendar */
  .card::before {
    content: ""; position: absolute; z-index: -1;
    left: 2.5%; right: 2.5%; top: 14%; bottom: -9px;
    background: var(--paper-back) var(--grain);
    border-radius: 12px;
    transform: rotate(2.2deg);
  }

  /* binder rings */
  .rings { display: flex; justify-content: space-around; padding: 0 8%; height: 0; position: relative; z-index: 2; }
  .rings span {
    width: 10px; height: 34px; border-radius: 99px;
    background: linear-gradient(90deg, var(--ring-shade), var(--ring) 45%, #fff 60%, var(--ring-shade));
    transform: translateY(-50%);
    position: relative;
  }
  .rings span::after { /* punched hole */
    content: ""; position: absolute; left: 50%; bottom: -6px; translate: -50% 0;
    width: 9px; height: 9px; border-radius: 50%; background: rgba(0,0,0,.45); z-index: -1;
  }

  /* header */
  .head {
    background: var(--hdr);
    background-image: var(--grain), linear-gradient(170deg, rgba(255,255,255,.10), rgba(0,0,0,.12));
    border-radius: 14px 14px 0 0;
    padding: 10% 5% 5% 6%;
    display: flex; align-items: flex-end; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .title { position: relative; flex: 1; min-width: 0; }
  .month {
    margin: 0;
    color: var(--paper);
    font-weight: 700;
    font-size: clamp(1.7rem, 10vw, 3rem);
    line-height: .95;
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  .month.long { font-size: clamp(1.4rem, 8vw, 2.4rem); }
  .year {
    margin: .25em 0 0 .1em;
    color: var(--paper); opacity: .75;
    font-weight: 500; font-size: clamp(.8rem, 3.6vw, 1rem);
    letter-spacing: .3em;
  }
  .motif { width: 28%; flex: none; position: relative; margin-bottom: -2%; }
  .motif svg { display: block; width: 100%; height: auto; }

  /* body */
  .body {
    background: var(--paper) var(--grain);
    border-radius: 0 0 14px 14px;
    padding: 4% 3.5% 4%;
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dow {
    background: color-mix(in srgb, var(--hdr) 50%, #1c0d12);
    color: var(--paper);
    border-radius: 5px;
    text-align: center;
    font-weight: 600;
    font-size: clamp(.58rem, 2.8vw, .8rem);
    padding: 3px 0;
    margin-bottom: 3px;
  }
  .day {
    aspect-ratio: 1;
    background: var(--cell);
    border-radius: 7px;
    display: grid; place-items: center;
    color: var(--hdr);
    font-weight: 600;
    font-size: clamp(1rem, 5.8vw, 1.6rem);
    box-shadow: inset 0 -2px 0 rgba(120,70,20,.12);
  }
  .day.weekend { background: color-mix(in srgb, var(--cell) 88%, var(--hdr)); }
  .day.empty { background: var(--cell-empty); box-shadow: none; }
  .day.past { background: var(--past-bg); color: var(--past-ink); box-shadow: inset 0 -2px 0 rgba(179,38,30,.15); }
  .day.today {
    background: var(--hdr);
    color: var(--paper);
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--hdr);
    position: relative; z-index: 1;
  }

  .left {
    margin: .9em 0 0;
    text-align: center;
    color: color-mix(in srgb, var(--hdr) 80%, #3a0d14);
    font-weight: 500;
    font-size: clamp(.8rem, 3.6vw, 1rem);
  }
</style>
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <div class="clock-zone" aria-hidden="true"></div>

  <main class="card" aria-live="polite">
    <div class="rings" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <header class="head">
      <div class="title">
        <h1 class="month" id="month">OCTOBER</h1>
        <p class="year" id="year">2026</p>
      </div>
      <div class="motif" id="motif" aria-hidden="true"></div>
    </header>
    <section class="body">
      <div class="grid" id="grid"></div>
      <p class="left" id="left"></p>
    </section>
  </main>

<script>
  const DOW = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
  const CREAM = "#F6E3BF";

  // ---------- shape helpers (all drawn in a 100x100 box unless noted) ----------
  const HEART = "M50 88C10 60 8 30 28 22c12-5 20 2 22 12 2-10 10-17 22-12 20 8 18 38-22 66z";
  const APPLE = "M50 30C34 18 12 28 14 52C16 74 34 92 50 84C66 92 84 74 86 52C88 28 66 18 50 30z";
  const LEAF  = "M50 4C82 24 94 62 50 96 6 62 18 24 50 4z";
  const DROP  = "M50 6C50 6 82 50 82 66A32 32 0 0 1 18 66C18 50 50 6 50 6z";
  const SPARK = "M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10z";
  const FLAKE = "M0-38V38M-33-19L33 19M-33 19L33-19M-8-30L0-22 8-30M-8 30L0 22 8 30M-30-7L-21-11-23-21M30 7L21 11 23 21M-30 7L-21 11-23 21M30-7L21-11 23-21";

  const sparkle = (x, y, size, fill = CREAM) =>
    `<path transform="translate(${x} ${y}) scale(${size / 10})" d="${SPARK}" fill="${fill}"/>`;
  const at = (x, y, sc, inner) => `<g transform="translate(${x} ${y}) scale(${sc})">${inner}</g>`;
  const burst = (cx, cy, r, color, n) => {
    let out = "";
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const x1 = cx + Math.cos(a) * r * .35, y1 = cy + Math.sin(a) * r * .35;
      const x2 = cx + Math.cos(a) * r, y2 = cy + Math.sin(a) * r;
      out += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
      out += `<circle cx="${(cx + Math.cos(a) * (r + 5)).toFixed(1)}" cy="${(cy + Math.sin(a) * (r + 5)).toFixed(1)}" r="2" fill="${color}"/>`;
    }
    return out;
  };
  const tulip = (x, y, color, len) =>
    `<path d="M${x} ${y}V${y + len}" stroke="#3F6B34" stroke-width="3.5" stroke-linecap="round"/>` +
    `<path transform="translate(${x} ${y})" d="M-12 0Q-13-20-6-18L0-26L6-18Q13-20 12 0Q0 9-12 0z" fill="${color}"/>`;
  const blossom = (x, y, sc) => at(x, y, sc,
    [0, 72, 144, 216, 288].map(a => `<ellipse cy="-9" rx="7" ry="10" transform="rotate(${a})" fill="#FBD7E1"/>`).join("") +
    `<circle r="4" fill="#E9B23A"/>`);
  const apple = (x, y, sc, color) => at(x, y, sc,
    `<path d="${APPLE}" fill="${color}"/><path d="M50 30Q50 18 56 10" stroke="#5A3A2A" stroke-width="4" fill="none" stroke-linecap="round"/>` +
    `<path d="M54 18Q70 6 80 14Q68 26 54 18z" fill="#6FA35A"/><ellipse cx="34" cy="46" rx="6" ry="12" fill="#fff" opacity=".3"/>`);

  // ---------- header illustration per month (viewBox 0 0 130 110) ----------
  const svg = inner => `<svg viewBox="0 0 130 110">${inner}</svg>`;
  const MOTIFS = [
    // Jan: frost and new-year sparkle
    svg(`<g stroke="${CREAM}" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(56 54)"><path d="${FLAKE}"/></g>` +
        sparkle(108, 24, 12) + sparkle(102, 80, 7) + sparkle(16, 20, 6)),
    // Feb: hearts
    svg(`<path transform="translate(8 2) scale(.9)" d="${HEART}" fill="${CREAM}"/>` +
        `<path transform="translate(78 46) scale(.44) rotate(14 50 50)" d="${HEART}" fill="#F28CA5"/>` +
        sparkle(112, 22, 8) + sparkle(20, 92, 5)),
    // Mar: tulips
    svg(tulip(40, 40, CREAM, 64) + tulip(68, 28, "#F2C14E", 76) + tulip(96, 46, "#F08A7A", 58) +
        `<path d="M68 104Q50 90 52 72Q66 80 68 104z" fill="#6FA35A"/><path d="M96 104Q112 92 110 78Q98 86 96 104z" fill="#6FA35A"/>`),
    // Apr: umbrella and rain
    svg(`<path d="M18 52A42 40 0 0 1 102 52Q91 44 81 52Q70 44 60 52Q49 44 39 52Q28 44 18 52z" fill="${CREAM}"/>` +
        `<path d="M60 12V8M60 52V86Q60 94 52 94Q45 94 45 87" stroke="${CREAM}" stroke-width="4" fill="none" stroke-linecap="round"/>` +
        [[14, 74], [30, 92], [96, 72], [114, 90], [112, 30]].map(([x, y]) => at(x - 5, y - 6, .12, `<path d="${DROP}" fill="#BFD6EE"/>`)).join("")),
    // May: blossom branch
    svg(`<path d="M4 100Q50 74 126 30" stroke="#5A3A2A" stroke-width="4.5" fill="none" stroke-linecap="round"/>` +
        `<path d="M70 62Q78 78 94 82" stroke="#5A3A2A" stroke-width="3" fill="none" stroke-linecap="round"/>` +
        blossom(38, 76, 1.1) + blossom(76, 50, 1.35) + blossom(112, 36, .95) + blossom(94, 82, .85) +
        `<ellipse cx="20" cy="40" rx="5" ry="7" transform="rotate(30 20 40)" fill="#FBD7E1"/>`),
    // Jun: sun and cloud
    svg(`<g stroke="${CREAM}" stroke-width="5" stroke-linecap="round" transform="translate(50 42)"><path d="M0-38v8M0 30v8M-38 0h8M30 0h8M-27-27l6 6M21 21l6 6M-27 27l6-6M21-21l6-6"/></g>` +
        `<circle cx="50" cy="42" r="21" fill="#F6C84A"/><circle cx="44" cy="36" r="6" fill="#F9DB80"/>` +
        `<g fill="${CREAM}"><circle cx="80" cy="76" r="13"/><circle cx="97" cy="68" r="17"/><circle cx="114" cy="78" r="11"/><rect x="74" y="76" width="48" height="14" rx="7"/></g>`),
    // Jul: seaside
    svg(`<g transform="translate(44 60)"><path d="M0 18L-26-4Q-24-34 0-36Q24-34 26-4z" fill="${CREAM}"/>` +
        `<path d="M0 18L-16-30M0 18L-6-35M0 18L6-35M0 18L16-30M0 18L-24-14M0 18L24-14" stroke="#E2B98A" stroke-width="2"/></g>` +
        `<path transform="translate(100 50) rotate(12)" d="M0-20L6-7L20-6L9 3L13 18L0 9L-13 18L-9 3L-20-6L-6-7z" fill="#F2A65A" stroke="#F2A65A" stroke-width="4" stroke-linejoin="round"/>` +
        `<path d="M4 98q14-9 28 0t28 0 28 0 28 0 28 0" stroke="${CREAM}" stroke-width="4" fill="none" stroke-linecap="round"/>` +
        `<circle cx="110" cy="16" r="4" fill="none" stroke="${CREAM}" stroke-width="2"/><circle cx="118" cy="28" r="2.5" fill="none" stroke="${CREAM}" stroke-width="2"/>`),
    // Aug: watermelon
    svg(`<g transform="translate(62 30)"><path d="M-52 0A52 52 0 0 0 52 0z" fill="#3F7A36"/><path d="M-46 0A46 46 0 0 0 46 0z" fill="${CREAM}"/>` +
        `<path d="M-41 0A41 41 0 0 0 41 0z" fill="#F47A78"/>` +
        [[-22, 12], [0, 22], [22, 12], [-11, 30], [11, 30]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="4.2" fill="#2A1A1A"/>`).join("") + `</g>` +
        sparkle(114, 18, 8) + sparkle(14, 18, 6)),
    // Sep: apples
    svg(apple(4, 8, .86, CREAM) + apple(58, 34, .72, "#E8B54A")),
    // Oct: autumn leaves and acorn (the original reference)
    svg(`<g transform="rotate(-18 70 50)">
      <path d="M70 6c4 9 13 7 15 15s-7 9-2 15 14 3 13 13-12 6-14 12 5 13-3 17-10-6-15-3-5 12-11 9 0-13-5-17-13 3-15-5 8-10 5-15-11-5-8-13 11-3 15-8-3-13 3-17 13 5 16-1-3-12 6-11z" fill="#E8A13A"/>
      <path d="M68 18l2 72M69 36l13-7M69 52l16-5M69 67l-14-7M69 45l-14-8" stroke="#B86A1E" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
      <path d="M100 26c10 6 18 18 12 34-8-4-15-14-12-34z" fill="#9C2E2A"/>
      <circle cx="114" cy="74" r="4.2" fill="#B23A33"/><circle cx="121" cy="83" r="3.6" fill="#B23A33"/><circle cx="110" cy="85" r="3.6" fill="#B23A33"/>
      <ellipse cx="44" cy="86" rx="17" ry="19" fill="#C98A4E"/><ellipse cx="38" cy="82" rx="4" ry="8" fill="#DDA56C"/>
      <path d="M25 76c2-13 36-13 38 0z" fill="#6B3E1E"/><path d="M44 63v-7" stroke="#6B3E1E" stroke-width="3" stroke-linecap="round"/>`),
    // Nov: fireworks
    svg(burst(48, 44, 32, "#F2C14E", 14) + `<circle cx="48" cy="44" r="4" fill="#F2C14E"/>` +
        burst(102, 30, 18, CREAM, 10) + burst(104, 82, 14, "#F28CB0", 9) + sparkle(16, 92, 6) + sparkle(78, 98, 5)),
    // Dec: christmas tree
    svg(`<rect x="58" y="96" width="12" height="12" rx="2" fill="#6B3E1E"/>` +
        `<path d="M64 14L90 46H78L100 74H86L108 100H20L42 74H28L50 46H38z" fill="#4E8F5A" stroke="#4E8F5A" stroke-width="3" stroke-linejoin="round"/>` +
        sparkle(64, 12, 13, "#F2C14E") +
        [[56, 44, CREAM], [74, 60, "#F2C14E"], [48, 72, "#F2C14E"], [82, 86, CREAM], [44, 92, CREAM], [66, 82, "#E85A5A"]]
          .map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`).join("") +
        sparkle(112, 30, 6) + sparkle(16, 34, 5)),
  ];

  // ---------- backdrop shapes ----------
  const BITS = {
    flake: c => `<g stroke="${c}" stroke-width="6" stroke-linecap="round" fill="none" transform="translate(50 50)"><path d="M0-42V42M-36-21L36 21M-36 21L36-21M-9-33L0-24 9-33M-9 33L0 24 9 33"/></g>`,
    heart: c => `<path d="${HEART}" fill="${c}"/>`,
    petal: c => `<ellipse cx="50" cy="50" rx="44" ry="24" fill="${c}"/>`,
    drop:  c => `<path d="${DROP}" fill="${c}"/>`,
    dot:   c => `<circle cx="50" cy="50" r="44" fill="${c}"/>`,
    ring:  c => `<circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-width="8"/>`,
    apple: c => `<path d="${APPLE}" fill="${c}"/>`,
    leaf:  c => `<path d="${LEAF}" fill="${c}"/><path d="M50 10V96M50 40l18-12M50 58l-20-12M50 72l18-10" stroke="rgba(0,0,0,.22)" stroke-width="3" fill="none"/>`,
    spark: c => `<path transform="translate(50 50) scale(4.6)" d="${SPARK}" fill="${c}"/>`,
  };
  const SOFT = ["dot", "ring"];   // round shapes look better slightly blurred even up close

  // ---------- the 12 themes ----------
  const MONTHS = [
    { name: "January",   hdr: "#3E6A8A", bg: "#0E1822", glow: "#BFDDFF", bits: ["flake"],        colors: ["#C9D8E6", "#8FA9C0", "#E8EEF3"] },
    { name: "February",  hdr: "#B03A5B", bg: "#1E0C13", glow: "#FF9DB5", bits: ["heart"],        colors: ["#E8738F", "#B03A5B", "#F5B3C2"] },
    { name: "March",     hdr: "#5E8C4A", bg: "#0F1A11", glow: "#FFE3A0", bits: ["petal"],        colors: ["#F08A7A", "#F2C14E", "#9CC78A"] },
    { name: "April",     hdr: "#5B7FA8", bg: "#0B1320", glow: "#CFE2FF", bits: ["drop"],         colors: ["#9EC1E6", "#6E93BF", "#D6E6F5"] },
    { name: "May",       hdr: "#C2607E", bg: "#211219", glow: "#FFD0DC", bits: ["petal"],        colors: ["#F4B6C6", "#E58FA8", "#FFE0E8"] },
    { name: "June",      hdr: "#D98A2B", bg: "#24180A", glow: "#FFD27A", bits: ["dot"],          colors: ["#F2B441", "#F5D78A", "#E0913A"] },
    { name: "July",      hdr: "#2E8A99", bg: "#061A1E", glow: "#9FE7F0", bits: ["ring", "dot"],  colors: ["#7FD3DE", "#3FA6B5", "#CDEFF3"] },
    { name: "August",    hdr: "#D2464F", bg: "#1F0C0D", glow: "#FFB0A0", bits: ["dot", "petal"], colors: ["#E5585F", "#6BA35A", "#F4A6A0"] },
    { name: "September", hdr: "#8C3B33", bg: "#1C0D0B", glow: "#FFC38A", bits: ["apple", "leaf"],colors: ["#C0392B", "#D9A441", "#7A9A3A"] },
    { name: "October",   hdr: "#C0532A", bg: "#22140A", glow: "#FFB45A", bits: ["leaf"],         colors: ["#B5652A", "#8E3B1F", "#D99A3E", "#6E2A16"] },
    { name: "November",  hdr: "#4B3270", bg: "#0E0817", glow: "#FFC860", bits: ["spark"],        colors: ["#F2C14E", "#E86A9A", "#8FD0FF"] },
    { name: "December",  hdr: "#9E2F35", bg: "#180B0E", glow: "#FFD9A0", bits: ["flake", "dot"], colors: ["#E8EEF3", "#D94545", "#E8C15A", "#3F7A4A"] },
  ];

  // Seeded random so the backdrop stays put between redraws.
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  function drawBackdrop(m, mi) {
    const r = rng(mi * 31 + 11);
    document.documentElement.style.setProperty("--glow", m.glow);
    // far (very blurry, big) -> mid -> near (sharp, hugging the edges)
    const layers = [
      { n: 7,  min: 140, max: 260, blur: 14, op: .35, edge: false },
      { n: 10, min: 50,  max: 120, blur: 5,  op: .55, edge: false },
      { n: 5,  min: 80,  max: 150, blur: 0,  op: .95, edge: true  },
    ];
    let html = "";
    for (let i = 0; i < 14; i++) {           // glowing bokeh
      const size = 20 + r() * 70;
      html += `<i style="width:${size}px;height:${size}px;left:${r() * 100}%;top:${r() * 100}%;opacity:${.15 + r() * .35};filter:blur(2px)"></i>`;
    }
    for (const L of layers) {
      for (let i = 0; i < L.n; i++) {
        const size = L.min + r() * (L.max - L.min);
        const x = L.edge ? (r() < .5 ? -8 + r() * 12 : 96 + r() * 12) : r() * 100;
        const y = L.edge ? 55 + r() * 45 : r() * 100;
        const color = m.colors[Math.floor(r() * m.colors.length)];
        const kind = m.bits[i % m.bits.length];
        const blur = L.blur === 0 && SOFT.includes(kind) ? 3 : L.blur;
        html += `<svg viewBox="0 0 100 100" style="width:${size}px;left:calc(${x}% - ${size / 2}px);top:calc(${y}% - ${size / 2}px);transform:rotate(${r() * 360}deg);opacity:${L.op};filter:blur(${blur}px)">${BITS[kind](color)}</svg>`;
      }
    }
    document.getElementById("backdrop").innerHTML = html;
  }

  function currentDate() {
    // Test hook: ?date=2027-02-14 renders that day instead of today.
    const p = new URLSearchParams(location.search).get("date");
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) {
      const [y, mo, d] = p.split("-").map(Number);
      return new Date(y, mo - 1, d);
    }
    return new Date();
  }

  function render(now) {
    const y = now.getFullYear(), mi = now.getMonth(), today = now.getDate();
    const m = MONTHS[mi];
    const root = document.documentElement.style;
    root.setProperty("--hdr", m.hdr);
    root.setProperty("--bg", m.bg);

    const title = document.getElementById("month");
    title.textContent = m.name.toUpperCase();
    title.classList.toggle("long", m.name.length >= 8);   // FEBRUARY, SEPTEMBER, ...
    document.getElementById("year").textContent = y;
    document.getElementById("motif").innerHTML = MOTIFS[mi];
    document.title = `${m.name} ${y}`;

    const daysInMonth = new Date(y, mi + 1, 0).getDate();
    const offset = (new Date(y, mi, 1).getDay() + 6) % 7;    // Monday = 0
    const cells = Math.ceil((offset + daysInMonth) / 7) * 7;  // 5 or 6 rows

    let html = DOW.map(d => `<div class="dow">${d}</div>`).join("");
    for (let i = 0; i < cells; i++) {
      const d = i - offset + 1;
      if (d < 1 || d > daysInMonth) { html += `<div class="day empty"></div>`; continue; }
      const weekend = i % 7 >= 5 ? " weekend" : "";
      const state = d < today ? " past" : d === today ? " today" : weekend;
      html += `<div class="day${state}"${d === today ? ' aria-current="date"' : ""}>${d}</div>`;
    }
    document.getElementById("grid").innerHTML = html;

    const left = daysInMonth - today;
    document.getElementById("left").textContent =
      left === 0 ? `Last day of ${m.name}` : left === 1 ? `1 day left in ${m.name}` : `${left} days left in ${m.name}`;

    drawBackdrop(m, mi);
  }

  // Redraw only when the date changes (midnight / month rollover).
  let shownKey = "";
  function tick() {
    const now = currentDate();
    const key = now.toDateString();
    if (key !== shownKey) { shownKey = key; render(now); }
  }
  tick();
  setInterval(tick, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
