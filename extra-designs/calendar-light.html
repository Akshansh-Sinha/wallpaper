<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8E6E1">
<title>Calendar</title>
<style>
  /* CMF-style minimal: pure black AMOLED, dot-matrix title, mono numerals, one accent colour per month.
     Tuned for CMF Phone 1 (1080x2400). Top ~21% stays empty for the lock-screen clock. */
  @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Medium.ttf");  font-weight: 500; }

  :root {
    --acc: #FF6A13;            /* set per month by JS */
    --ink: #141414;
    --dim: #77746C;
    --off: #DAD7D0;            /* unlit dots / hairlines */
    --past: #D8281C;
    --onacc: #fff;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #E8E6E1;
    color: var(--ink);
    font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* faint dot grid + a whisper of accent glow */
  .backdrop {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 18% 88%, color-mix(in srgb, var(--acc) 14%, transparent), transparent 55%),
      radial-gradient(#C9C6BD 1.3px, transparent 1.8px) 0 0 / 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 78%);
            mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 78%);
  }

  .clock-zone { flex: 0 0 21vh; }

  .card {
    position: relative;
    width: min(88vw, 430px);
    padding: 22px 20px 18px;
    background: #F6F5F1;
    border: 1px solid #DEDBD4;
    border-radius: 30px;
    box-shadow: 0 18px 50px rgba(0,0,0,.10);
  }

  /* header */
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .title { width: 62%; line-height: 0; }
  .title svg { width: 100%; height: auto; display: block; }
  .screw { width: 22px; height: 22px; margin-top: 2px; }
  .sub {
    margin: 14px 0 0;
    font-size: 12px; letter-spacing: .22em; color: var(--dim);
  }
  .rule { height: 1px; background: var(--off); margin: 16px 0 10px; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
  .dow { text-align: center; font-size: 11px; letter-spacing: .1em; color: var(--dim); padding-bottom: 6px; }
  .dow.we { color: #B3B0A8; }
  .day {
    height: 42px; display: grid; place-items: center;
    font-size: 17px; font-weight: 400; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .day.we   { color: var(--dim); }
  .day.past { color: var(--past); opacity: .78; }
  .day.empty::after { content: ""; width: 3px; height: 3px; border-radius: 50%; background: #CFCCC4; }
  .day.today {
    width: 40px; height: 40px; margin: 1px auto 0;
    border-radius: 50%;
    background: var(--acc); color: var(--onacc); font-weight: 500;
  }

  /* footer */
  .strip { display: flex; justify-content: space-between; margin-top: 12px; }
  .strip i { width: 5px; height: 5px; border-radius: 50%; background: #D5D2CA; }
  .strip i.p { background: var(--past); opacity: .85; }
  .strip i.t { background: var(--acc); }
  .foot { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; letter-spacing: .14em; color: var(--dim); }
  .foot b { font-weight: 500; color: var(--acc); }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="clock-zone" aria-hidden="true"></div>

  <main class="card" aria-live="polite">
    <div class="head">
      <div class="title" id="title"></div>
      <svg class="screw" viewBox="0 0 22 22" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="9"/><path d="M11 6.5v9M6.5 11h9"/>
      </svg>
    </div>
    <p class="sub" id="sub"></p>
    <div class="rule"></div>
    <div class="grid" id="grid"></div>
    <div class="rule" style="margin-top:10px"></div>
    <div class="strip" id="strip"></div>
    <div class="foot"><span id="left"></span><b id="count"></b></div>
  </main>

<script>
  // ---------- 5x7 dot-matrix glyphs (only the letters we need) ----------
  const G = {
    A:"01110 10001 10001 11111 10001 10001 10001", B:"11110 10001 10001 11110 10001 10001 11110",
    C:"01110 10001 10000 10000 10000 10001 01110", D:"11110 10001 10001 10001 10001 10001 11110",
    E:"11111 10000 10000 11110 10000 10000 11111", F:"11111 10000 10000 11110 10000 10000 10000",
    G:"01110 10001 10000 10111 10001 10001 01111", J:"00111 00010 00010 00010 00010 10010 01100",
    L:"10000 10000 10000 10000 10000 10000 11111", M:"10001 11011 10101 10101 10001 10001 10001",
    N:"10001 11001 10101 10011 10001 10001 10001", O:"01110 10001 10001 10001 10001 10001 01110",
    P:"11110 10001 10001 11110 10000 10000 10000", R:"11110 10001 10001 11110 10100 10010 10001",
    S:"01111 10000 10000 01110 00001 00001 11110", T:"11111 00100 00100 00100 00100 00100 00100",
    U:"10001 10001 10001 10001 10001 10001 01110", V:"10001 10001 10001 10001 10001 01010 00100",
    Y:"10001 10001 01010 00100 00100 00100 00100",
  };

  // One accent per month (CMF-style: restrained, one colour at a time).
  const MONTHS = [
    { name: "JANUARY",   abbr: "JAN", acc: "#3D7BEA" },
    { name: "FEBRUARY",  abbr: "FEB", acc: "#E5386D" },
    { name: "MARCH",     abbr: "MAR", acc: "#2FA84F" },
    { name: "APRIL",     abbr: "APR", acc: "#0E9ADB" },
    { name: "MAY",       abbr: "MAY", acc: "#E0629E" },
    { name: "JUNE",      abbr: "JUN", acc: "#E8A800" },
    { name: "JULY",      abbr: "JUL", acc: "#00B39A" },
    { name: "AUGUST",    abbr: "AUG", acc: "#F2602E" },
    { name: "SEPTEMBER", abbr: "SEP", acc: "#7FA11A" },
    { name: "OCTOBER",   abbr: "OCT", acc: "#FF5A00" },
    { name: "NOVEMBER",  abbr: "NOV", acc: "#7B4DE0" },
    { name: "DECEMBER",  abbr: "DEC", acc: "#141414" },
  ];
  const DOW = ["M", "T", "W", "T", "F", "S", "S"];

  // Draw text as a lit/unlit dot matrix.
  function dotText(str, color) {
    const cell = 10, r = 3.7;
    const cols = str.length * 6 - 1;
    let out = "";
    [...str].forEach((ch, i) => {
      const g = G[ch].split(" ");
      for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) {
        const lit = g[y][x] === "1";
        out += `<circle cx="${(i * 6 + x + .5) * cell}" cy="${(y + .5) * cell}" r="${r}" fill="${lit ? color : "#E3E0D9"}"/>`;
      }
    });
    return `<svg viewBox="0 0 ${cols * cell} ${7 * cell}">${out}</svg>`;
  }

  function currentDate() {
    // Test hook: ?date=2027-02-14 renders that day instead of today.
    const p = new URLSearchParams(location.search).get("date");
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) {
      const [y, mo, d] = p.split("-").map(Number);
      return new Date(y, mo - 1, d);
    }
    return new Date();
  }

  const pad = n => String(n).padStart(2, "0");

  function render(now) {
    const y = now.getFullYear(), mi = now.getMonth(), today = now.getDate();
    const m = MONTHS[mi];
    document.documentElement.style.setProperty("--acc", m.acc);
    document.documentElement.style.setProperty("--onacc", m.abbr === "JUN" ? "#141414" : "#fff");
    document.title = `${m.name} ${y}`;

    document.getElementById("title").innerHTML = dotText(m.abbr, m.acc);
    document.getElementById("sub").textContent = `${m.name}  ·  ${y}`;

    const daysInMonth = new Date(y, mi + 1, 0).getDate();
    const offset = (new Date(y, mi, 1).getDay() + 6) % 7;     // Monday = 0
    const cells = Math.ceil((offset + daysInMonth) / 7) * 7;   // 5 or 6 rows

    let html = DOW.map((d, i) => `<div class="dow${i >= 5 ? " we" : ""}">${d}</div>`).join("");
    for (let i = 0; i < cells; i++) {
      const d = i - offset + 1;
      if (d < 1 || d > daysInMonth) { html += `<div class="day empty"></div>`; continue; }
      const cls = d < today ? "past" : d === today ? "today" : i % 7 >= 5 ? "we" : "";
      html += `<div class="day ${cls}"${d === today ? ' aria-current="date"' : ""}>${d}</div>`;
    }
    document.getElementById("grid").innerHTML = html;

    let strip = "";
    for (let d = 1; d <= daysInMonth; d++) strip += `<i class="${d < today ? "p" : d === today ? "t" : ""}"></i>`;
    document.getElementById("strip").innerHTML = strip;

    const left = daysInMonth - today;
    document.getElementById("left").textContent = left === 0 ? "LAST DAY" : `${pad(left)} ${left === 1 ? "DAY" : "DAYS"} LEFT`;
    document.getElementById("count").textContent = `${pad(today)}/${pad(daysInMonth)}`;
  }

  // Redraw only when the date changes (midnight / month rollover).
  let shownKey = "";
  function tick() {
    const now = currentDate();
    const key = now.toDateString();
    if (key !== shownKey) { shownKey = key; render(now); }
  }
  tick();
  setInterval(tick, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
